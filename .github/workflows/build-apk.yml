name: Build Hexiva APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Regression tests
        run: npm test

      - name: Build offline web release
        run: npm run build:web

      - name: Create Android project
        run: |
          npx cap add android
          node scripts/configure-android.mjs
          npx cap sync android
          node scripts/configure-android.mjs

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Stage APK
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/Hexiva-v43.3-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hexiva-v43.3-debug-apk
          path: apk/Hexiva-v43.3-debug.apk
          if-no-files-found: error
          retention-days: 14
